<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IVORA — Smart Multi-Bed IV Workflow & Event Monitoring</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
:root{
--bg: #F5F8FC;
--bg-deep: #EEF2F9;
--surface: #FFFFFF;
--surface-tint: #F7F9FD;
--sidebar: #F0F3FA;
--primary: #6B6FA8;
--primary-dark: #565A8C;
--primary-tint: #E9E9F5;
--normal-bg: #E3F3EA;
--normal-fg: #2F6B52;
--normal-line:#B9E0C8;
--attn-bg: #FBF0DC;
--attn-fg: #8A6423;
--attn-line:#F0DBAE;
--high-bg: #F7E3E1;
--high-fg: #9C4A42;
--high-line:#EFC3BE;
--review-bg:#EAE7F5;
--review-fg:#5B549C;
--review-line:#D3CDEE;
--offline-bg:#EAEDF2;
--offline-fg:#57606F;
--offline-line:#D7DCE4;
--text: #212A3B;
--text-soft:#5B6478;
--text-faint:#8891A3;
--border: #E3E8F0;
--border-soft:#EDF1F6;
--shadow-sm: 0 1px 2px rgba(33,42,59,0.05);
--shadow-md: 0 4px 16px rgba(33,42,59,0.07);
--shadow-lg: 0 12px 32px rgba(33,42,59,0.10);
--radius: 14px;
--radius-sm: 10px;
--radius-lg: 20px;
--font-display: 'Fraunces', serif;
--font-body: 'Inter', sans-serif;
--font-mono: 'IBM Plex Mono', monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
background:var(--bg);
color:var(--text);
font-family:var(--font-body);
-webkit-font-smoothing:antialiased;
font-size:14px;
}
#root{min-height:100vh;}
button{font-family:inherit;cursor:pointer;}
::selection{background:var(--primary-tint);}
*:focus-visible{outline:2px solid var(--primary); outline-offset:2px; border-radius:4px;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:#D6DCE6;border-radius:10px;border:2px solid var(--bg);}
::-webkit-scrollbar-track{background:transparent;}

/* ---------- layout ---------- */
.app-shell{display:flex;min-height:100vh;}
.sidebar{
width:236px; flex-shrink:0; background:var(--sidebar); border-right:1px solid var(--border-soft);
display:flex; flex-direction:column; padding:20px 14px; position:sticky; top:0; height:100vh;
}
.sidebar-brand{display:flex;align-items:center;gap:10px;padding:6px 8px 22px 8px;}
.brand-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--primary),#9497C9);display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-display);font-weight:700;font-size:17px;box-shadow:var(--shadow-sm);}
.brand-word{font-family:var(--font-display);font-weight:600;font-size:19px;letter-spacing:0.2px;color:var(--text);}
.brand-sub{font-size:10px;color:var(--text-faint);letter-spacing:1.2px;text-transform:uppercase;margin-top:-2px;}
.nav-group-label{font-size:10.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text-faint);margin:16px 10px 6px;}
.nav-item{
display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;color:var(--text-soft);
font-size:13.5px;font-weight:500;margin-bottom:2px;border:1px solid transparent;transition:background .15s,color .15s;
background:none;width:100%;text-align:left;
}
.nav-item:hover{background:#E4E8F4;color:var(--text);}
.nav-item.active{background:var(--surface);color:var(--primary-dark);font-weight:600;border-color:var(--border);box-shadow:var(--shadow-sm);}
.nav-icon{width:17px;height:17px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.nav-badge{margin-left:auto;background:var(--high-bg);color:var(--high-fg);font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:20px;}
.sidebar-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--border-soft);}
.disclaimer-mini{font-size:10.5px;color:var(--text-faint);line-height:1.5;padding:8px;background:var(--bg-deep);border-radius:8px;}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
display:flex;align-items:center;gap:14px;padding:13px 26px;background:rgba(245,248,252,0.85);backdrop-filter:blur(8px);
border-bottom:1px solid var(--border-soft);position:sticky;top:0;z-index:20;
}
.search-box{
flex:1;max-width:360px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);
border-radius:10px;padding:8px 12px;color:var(--text-faint);font-size:13px;cursor:pointer;
}
.search-box kbd{margin-left:auto;font-family:var(--font-mono);font-size:10.5px;background:var(--bg-deep);border:1px solid var(--border);padding:1px 6px;border-radius:5px;color:var(--text-soft);}
.topbar-right{display:flex;align-items:center;gap:10px;margin-left:auto;}

.mode-toggle-pill{
display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);
padding:4px 8px;border-radius:20px;font-size:11.5px;font-weight:600;
}
.mode-toggle-btn{
padding:3px 8px;border-radius:14px;border:none;background:none;font-size:11px;font-weight:600;color:var(--text-soft);
}
.mode-toggle-btn.active{
background:var(--primary);color:#fff;
}

.live-pill{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--normal-fg);background:var(--normal-bg);border:1px solid var(--normal-line);padding:6px 11px;border-radius:20px;font-weight:600;}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--normal-fg);animation:pulse-dot 2.4s ease-in-out infinite;}
@keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.45;transform:scale(1.3);}}
.role-switch{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);padding:5px 6px 5px 12px;border-radius:20px;}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--primary-tint);color:var(--primary-dark);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;}
.content{padding:26px 30px 60px;max-width:1440px;}

/* ---------- typography ---------- */
h1,h2,h3{font-family:var(--font-display);font-weight:600;color:var(--text);margin:0;}
.page-title{font-size:26px;letter-spacing:-0.2px;}
.page-sub{color:var(--text-soft);font-size:13.5px;margin-top:4px;}
.section-label{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text-faint);}
.mono{font-family:var(--font-mono);}

/* ---------- cards & chips ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);}
.card-pad{padding:18px 20px;}
.grid{display:grid;gap:16px;}
.summary-row{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:22px;}
.summary-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;position:relative;overflow:hidden;transition:transform .18s, box-shadow .18s;}
.summary-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}
.summary-num{font-family:var(--font-display);font-size:28px;font-weight:600;}
.summary-lbl{font-size:12px;color:var(--text-soft);margin-top:2px;}
.summary-bar{position:absolute;left:0;top:0;bottom:0;width:4px;}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px;border:1px solid transparent;white-space:nowrap;}
.badge-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.badge.normal{background:var(--normal-bg);color:var(--normal-fg);border-color:var(--normal-line);}
.badge.attention{background:var(--attn-bg);color:var(--attn-fg);border-color:var(--attn-line);}
.badge.high{background:var(--high-bg);color:var(--high-fg);border-color:var(--high-line);}
.badge.review{background:var(--review-bg);color:var(--review-fg);border-color:var(--review-line);}
.badge.offline{background:var(--offline-bg);color:var(--offline-fg);border-color:var(--offline-line);}
.badge .badge-dot.normal{background:var(--normal-fg);} .badge .badge-dot.attention{background:var(--attn-fg);}
.badge .badge-dot.high{background:var(--high-fg);} .badge .badge-dot.review{background:var(--review-fg);}
.badge .badge-dot.offline{background:var(--offline-fg);}

.chip{font-size:12px;font-weight:500;padding:6px 12px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--text-soft);transition:.15s;}
.chip:hover{border-color:var(--primary);color:var(--primary-dark);}
.chip.active{background:var(--primary);color:#fff;border-color:var(--primary);}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;padding:9px 15px;border-radius:10px;border:1px solid transparent;transition:transform .12s, box-shadow .12s, background .15s;}
.btn:active{transform:scale(0.97);}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 2px 8px rgba(107,111,168,0.30);}
.btn-primary:hover{background:var(--primary-dark);}
.btn-ghost{background:var(--surface);color:var(--text);border-color:var(--border);}
.btn-ghost:hover{border-color:var(--primary);color:var(--primary-dark);}
.btn-subtle{background:var(--bg-deep);color:var(--text-soft);}
.btn-subtle:hover{background:var(--border);}
.btn-high{background:var(--high-fg);color:#fff;}
.btn-high:hover{opacity:0.9;}
.btn-sm{padding:6px 11px;font-size:12px;border-radius:8px;}
.btn:disabled{opacity:0.45;cursor:not-allowed;}
.icon-btn{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:9px;background:var(--surface);border:1px solid var(--border);color:var(--text-soft);}
.icon-btn:hover{color:var(--primary-dark);border-color:var(--primary);}

/* ---------- bed card ---------- */
.bed-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;}
.bed-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;cursor:pointer;transition:transform .16s,box-shadow .16s,border-color .16s;position:relative;}
.bed-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:#D6DBEA;}
.bed-card.high{border-color:var(--high-line);}
.bed-card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
.bed-no{font-family:var(--font-display);font-size:19px;font-weight:600;}
.bed-patient{font-size:11.5px;color:var(--text-faint);margin-top:1px;}
.bed-metric-row{display:flex;justify-content:space-between;align-items:flex-end;margin:12px 0 8px;}
.bed-weight{font-family:var(--font-mono);font-size:22px;font-weight:600;}
.bed-weight-unit{font-size:12px;color:var(--text-faint);font-weight:400;margin-left:3px;}
.bed-flow{font-size:12px;color:var(--text-soft);text-align:right;}
.bed-ai-row{display:flex;justify-content:space-between;align-items:center;background:var(--surface-tint);padding:6px 10px;border-radius:8px;font-size:11px;color:var(--text-soft);margin-top:10px;}
.bed-foot{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--text-faint);margin-top:10px;padding-top:8px;border-top:1px solid var(--border-soft);}
.device-dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:4px;}
.spark-wrap{height:34px;margin:4px 0;}

/* ---------- ward pulse ---------- */
.pulse-panel{background:radial-gradient(circle at 30% 20%, #FBFCFE 0%, var(--surface) 60%);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px 24px;margin-bottom:22px;box-shadow:var(--shadow-sm);}
.pulse-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:10px;margin-top:16px;}
.pulse-cell{aspect-ratio:1;border-radius:9px;position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s;}
.pulse-cell:hover{transform:scale(1.08);}
.pulse-core{width:60%;height:60%;border-radius:50%;}
.pulse-core.breathing{animation:breathe 3.2s ease-in-out infinite;}
@keyframes breathe{0%,100%{transform:scale(0.92);opacity:0.85;}50%{transform:scale(1.05);opacity:1;}}
.pulse-label{position:absolute;bottom:3px;right:6px;font-size:9px;font-family:var(--font-mono);color:var(--text-faint);}

/* ---------- timeline ---------- */
.timeline{position:relative;padding-left:22px;}
.timeline::before{content:'';position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--border);}
.tl-item{position:relative;padding-bottom:20px;}
.tl-dot{position:absolute;left:-22px;top:2px;width:12px;height:12px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 2px var(--border);}
.tl-time{font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);}
.tl-title{font-size:13px;font-weight:600;margin:1px 0 2px;}
.tl-desc{font-size:12px;color:var(--text-soft);line-height:1.5;}

/* ---------- drawer/modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(33,42,59,0.32);backdrop-filter:blur(2px);z-index:100;display:flex;justify-content:flex-end;animation:fade-in .18s ease;}
@keyframes fade-in{from{opacity:0;}to{opacity:1;}}
.drawer{width:480px;max-width:92vw;background:var(--surface);height:100%;overflow-y:auto;box-shadow:var(--shadow-lg);animation:slide-in .22s cubic-bezier(.16,1,.3,1);}
@keyframes slide-in{from{transform:translateX(24px);opacity:0.6;}to{transform:translateX(0);opacity:1;}}
.modal-center{position:fixed;inset:0;background:rgba(33,42,59,0.32);backdrop-filter:blur(2px);z-index:100;display:flex;align-items:center;justify-content:center;animation:fade-in .18s ease;}
.modal-box{background:var(--surface);border-radius:var(--radius-lg);width:480px;max-width:92vw;box-shadow:var(--shadow-lg);padding:24px;animation:pop-in .18s cubic-bezier(.16,1,.3,1);}
@keyframes pop-in{from{transform:scale(0.96);opacity:0;}to{transform:scale(1);opacity:1;}}
.drawer-head{padding:20px 22px;border-bottom:1px solid var(--border-soft);display:flex;justify-content:space-between;align-items:flex-start;}
.drawer-body{padding:20px 22px;}
.evidence-item{display:flex;align-items:center;gap:9px;padding:9px 11px;background:var(--normal-bg);border:1px solid var(--normal-line);border-radius:9px;font-size:12.5px;color:var(--normal-fg);margin-bottom:7px;font-weight:500;}
.evidence-item.pending{background:var(--bg-deep);border-color:var(--border);color:var(--text-faint);}

/* ---------- toast ---------- */
.toast-stack{position:fixed;bottom:22px;right:22px;z-index:200;display:flex;flex-direction:column;gap:10px;}
.toast{background:var(--text);color:#fff;padding:12px 16px;border-radius:10px;font-size:13px;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:10px;animation:toast-in .22s cubic-bezier(.16,1,.3,1);min-width:220px;}
@keyframes toast-in{from{transform:translateY(10px);opacity:0;}to{transform:translateY(0);opacity:1;}}

/* ---------- misc ---------- */
.tabs{display:flex;gap:4px;background:var(--bg-deep);padding:4px;border-radius:11px;width:fit-content;}
.tab{padding:7px 14px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--text-soft);border:none;background:none;}
.tab.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm);}
.empty-state{text-align:center;padding:50px 20px;color:var(--text-faint);}
table.data-table{width:100%;border-collapse:collapse;font-size:12.5px;}
table.data-table th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:0.6px;color:var(--text-faint);padding:9px 12px;border-bottom:1px solid var(--border);}
table.data-table td{padding:11px 12px;border-bottom:1px solid var(--border-soft);}
table.data-table tr:hover td{background:var(--surface-tint);}
.disclaimer{font-size:11.5px;color:var(--text-faint);background:var(--bg-deep);border:1px dashed var(--border);border-radius:9px;padding:9px 12px;margin-top:14px;}
.input{width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--border);background:var(--surface-tint);font-size:13.5px;margin-top:5px;font-family:inherit;color:var(--text);}
.input:focus{outline:none;border-color:var(--primary);background:#fff;}
.field-label{font-size:12px;font-weight:600;color:var(--text-soft);}
.ai-badge-group{display:flex;align-items:center;gap:8px;}
.metric-box{background:var(--surface-tint);border:1px solid var(--border-soft);padding:10px 12px;border-radius:10px;}
.metric-box-title{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.5px;}
.metric-box-val{font-family:var(--font-mono);font-size:18px;font-weight:600;color:var(--text);margin-top:2px;}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const {useState, useMemo, useEffect, useRef} = React;

/* ============================= ICONS ============================= */
const Icon = ({d, size=17, ...p}) => (
<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" {...p}>{d}</svg>
);
const ICONS = {
overview:<><path d="M3 12l9-9 9 9"/><path d="M9 21V12h6v9"/></>,
shift:<><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></>,
ward:<><rect x="3" y="4" width="7" height="7" rx="1.5"/><rect x="14" y="4" width="7" height="7" rx="1.5"/><rect x="3" y="15" width="7" height="7" rx="1.5"/><rect x="14" y="15" width="7" height="7" rx="1.5"/></>,
alert:<><path d="M12 3l9 17H3z"/><path d="M12 10v4"/><circle cx="12" cy="17" r="0.6" fill="currentColor"/></>,
bed:<><path d="M3 18v-7a2 2 0 012-2h3v4"/><path d="M3 13h18v5"/><path d="M8 13V8a2 2 0 012-2h9a2 2 0 012 2v5"/></>,
analytics:<><path d="M4 20V10"/><path d="M11 20V4"/><path d="M18 20v-7"/></>,
device:<><rect x="4" y="3" width="16" height="14" rx="2"/><path d="M9 21h6"/><path d="M8 8h8M8 11h5"/></>,

admin:<><circle cx="12" cy="8" r="3.4"/><path d="M4.5 20a7.5 7.5 0 0115 0"/></>,

arrow:<path d="M9 6l6 6-6 6"/>,
filter:<path d="M4 5h16M7 12h10M10 19h4"/>,
clock:<><circle cx="12" cy="12" r="9"/><path d="M12 7v5l4 2"/></>,
gauge:<><path d="M4 15a8 8 0 0116 0"/><path d="M12 15l4-4"/><circle cx="12" cy="15" r="1"/></>,
calib:<><path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.1-3.1a5 5 0 01-6.6 6.6L5.4 21.5a2 2 0 01-2.8-2.8L11.3 9a5 5 0 016.6-6.6l-3.1 3.1z"/></>,
users:<><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20a6.5 6.5 0 0113 0"/><path d="M16.5 8.5a3 3 0 010 5.9"/><path d="M20 20a6 6 0 00-4-5.6"/></>,
play:<path d="M6 4l14 8-14 8V4z"/>,
dots:<><circle cx="5" cy="12" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/><circle cx="19" cy="12" r="1.3" fill="currentColor"/></>,
};
const Ic = ({name, ...p}) => <Icon d={ICONS[name]} {...p}/>;

/* ============================= STATUS CONFIG ============================= */
const STATUS = {
normal:{label:'Normal', bg:'var(--normal-bg)', fg:'var(--normal-fg)', line:'var(--normal-line)'},
attention:{label:'Attention', bg:'var(--attn-bg)', fg:'var(--attn-fg)', line:'var(--attn-line)'},

/* ============================= SPARKLINES & CHARTS ============================= */
function Sparkline({data, color='var(--primary)', height=34}){
  if (!data || data.length === 0) return null;
  const w = 100, h = 100;
  const min = Math.min(...data), max = Math.max(...data);
  const norm = data.map((v,i)=> [ (i/(data.length-1))*w, h - ((v-min)/((max-min)||1))*h ]);
  const path = norm.map((p,i)=> (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const areaPath = path + ` L${w},${h} L0,${h} Z`;
  const id = 'grad-'+Math.round(Math.random()*100000);
  return (
    <div className="spark-wrap">
      <svg viewBox={`0 0 ${w} ${h}`} width="100%" height={height} preserveAspectRatio="none">
        <defs><linearGradient id={id} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity="0.25"/><stop offset="100%" stopColor={color} stopOpacity="0"/>
        </linearGradient></defs>
        <path d={areaPath} fill={`url(#${id})`} stroke="none"/>
        <path d={path} fill="none" stroke={color} strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"/>
      </svg>
    </div>
  );
}

function LiveChart({height=240, points=[]}){
  const pts = points.length > 0 ? points : [380, 379.5, 379.0, 378.2, 377.9, 377.1, 376.5, 376.0];
  const w=1000, h=280;
  const min = Math.min(...pts) - 2, max = Math.max(...pts) + 2;
  const toXY = (arr) => arr.map((v,i)=>[ (i/(arr.length-1))*w, h-((v-min)/((max-min)||1))*h ]);
  const p = toXY(pts);
  const d = p.map((pt,i)=>(i===0?'M':'L')+pt[0].toFixed(1)+','+pt[1].toFixed(1)).join(' ');

  return (
    <svg viewBox={`0 0 ${w} ${h}`} width="100%" height={height} preserveAspectRatio="none">
      {[0.25, 0.5, 0.75].map(f=> <line key={f} x1="0" x2={w} y1={h*f} y2={h*f} stroke="var(--border-soft)" strokeWidth="1"/>)}
      <path d={d} fill="none" stroke="var(--primary)" strokeWidth="2.8" strokeLinecap="round"/>
      {p.length > 0 && <circle cx={p[p.length-1][0]} cy={p[p.length-1][1]} r="6" fill="var(--primary)"/>}
    </svg>
  );
}

function Toasts({toasts}){
  return <div className="toast-stack">{toasts.map(t=> <div className="toast" key={t.id}><Ic name="check" size={14}/>{t.text}</div>)}</div>;
}

/* ============================= MAIN APP ============================= */
function App(){
  const [isLiveMode, setIsLiveMode] = useState(false);
  const [page, setPage] = useState('myshift');
  const [selectedBed, setSelectedBed] = useState(null);
  const [selectedAlert, setSelectedAlert] = useState(null);
  const [toasts, setToasts] = useState([]);
  const [beds, setBeds] = useState(MockData.getBeds());
  const [alerts, setAlerts] = useState(MockData.getAlerts());
  const [devices, setDevices] = useState(MockData.getDevices());
  const [apiConnected, setApiConnected] = useState(false);

  const pushToast = (text)=>{
    const id = Date.now();
    setToasts(t=>[...t,{id,text}]);
    setTimeout(()=> setToasts(t=>t.filter(x=>x.id!==id)), 2800);
  };

  // Poll backend if Live Mode is active
  useEffect(() => {
    let timer;
    const fetchLiveData = async () => {
      try {
        const summary = await ApiClient.getSummary();
        const activeAlerts = await ApiClient.getAlerts();
        const activeDevices = await ApiClient.getDevices();

        // Transform backend DTOs to UI model
        const mappedBeds = summary.beds.map(b => {
          let st = 'normal';
          if (b.currentEventType === 'FLOW_INTERRUPTION') st = 'high';
          else if (b.sensorStatus === 'POSSIBLE_DRIFT') st = 'review';
          else if (b.deviceStatus === 'OFFLINE' || !b.dataFresh) st = 'offline';

          return {
            bedId: b.bedId,
            bedCode: b.bedCode,
            name: b.name,
            ward: 'North Wing, Station A',
            patient: b.bedCode === 'BED_1' ? 'IV Container 1' : 'IV Container 2',
            nurse: 'R. Anand',
            currentWeight: b.currentWeight || 0.0,
            filteredWeight: b.filteredWeight || 0.0,
            flowRate: b.flowRate || 0.0,
            smoothedFlowRate: b.smoothedFlowRate || 0.0,
            baseline: b.baseline || 0.0,
            driftScore: b.driftScore || 0.0,
            anomalyScore: b.anomalyScore || 0.0,
            sensorStatus: b.sensorStatus || 'AI_UNAVAILABLE',
            deviceStatus: b.deviceStatus || 'ONLINE',
            dataFresh: b.dataFresh,
            currentEventType: b.currentEventType || 'NORMAL_FLOW',
            status: st,
            deviceId: b.deviceId || 'ESP32_01',
            trend: MockData.genSparkline(b.filteredWeight || 300, 2),
            lastUpdated: b.dataFresh ? 'Live' : 'Stale'
          };
        });

        setBeds(mappedBeds);
        setAlerts(activeAlerts);
        setDevices(activeDevices);
        setApiConnected(true);
      } catch (err) {
        setApiConnected(false);
        if (isLiveMode) {
          // Keep showing toast on initial disconnect
        }
      }
    };

    if (isLiveMode) {
      fetchLiveData();
      timer = setInterval(fetchLiveData, 3000);
    } else {
      setBeds(MockData.getBeds());
      setAlerts(MockData.getAlerts());
      setDevices(MockData.getDevices());
    }

    return () => clearInterval(timer);
  }, [isLiveMode]);

  const toggleMode = (live) => {
    setIsLiveMode(live);
    pushToast(live ? 'Switched to Live Backend API Mode (port 8080)' : 'Switched to Mock Demo Mode');
  };

  const handleAcknowledge = async (alertId) => {
    if (isLiveMode) {
      try {
        await ApiClient.acknowledgeAlert(alertId);
        pushToast('Alert acknowledged via backend API');
      } catch (e) {
        pushToast('API acknowledge failed, updating locally');
      }
    } else {
      pushToast('Alert acknowledged (mock)');
    }
    setAlerts(prev => prev.map(a => a.id === alertId ? {...a, status: 'ACKNOWLEDGED'} : a));
  };

  const handleResolve = async (alertId) => {
    if (isLiveMode) {
      try {
        await ApiClient.resolveAlert(alertId);
        pushToast('Alert resolved via backend API');
      } catch (e) {
        pushToast('API resolve failed, updating locally');
      }
    } else {
      pushToast('Alert resolved (mock)');
    }
    setAlerts(prev => prev.map(a => a.id === alertId ? {...a, status: 'RESOLVED'} : a));
  };

  const handleTare = async (bedCode) => {
    if (isLiveMode) {
      try {
        await ApiClient.tareBed(bedCode);
        pushToast(`Sensor on ${bedCode} tared successfully`);
      } catch (e) {
        pushToast('Tare command failed on backend');
      }
    } else {
      pushToast(`Tare offset applied to ${bedCode} (mock)`);
    }
  };

  const openAlertsCount = alerts.filter(a => a.status !== 'RESOLVED').length;

  let pageEl;
  if (selectedBed) {
    pageEl = <BedDetailPage bed={selectedBed} onBack={() => setSelectedBed(null)} onTare={handleTare} pushToast={pushToast} isLive={isLiveMode}/>;
  } else if (page === 'myshift' || page === 'ward') {
    pageEl = <WardMonitorPage beds={beds} alerts={alerts} setSelectedBed={setSelectedBed} setSelectedAlert={setSelectedAlert} onAcknowledge={handleAcknowledge} onResolve={handleResolve}/>;
  } else if (page === 'alerts') {
    pageEl = <AlertsPage alerts={alerts} setSelectedAlert={setSelectedAlert} onAcknowledge={handleAcknowledge} onResolve={handleResolve}/>;
  } else if (page === 'devices') {
    pageEl = <DevicesPage devices={devices} setSelectedBed={setSelectedBed} beds={beds}/>;
  } else if (page === 'drift') {
    pageEl = <DriftStudioPage beds={beds}/>;
  } else if (page === 'calibration') {
    pageEl = <CalibrationPage beds={beds} onTare={handleTare} pushToast={pushToast}/>;
  } else if (page === 'analytics') {
    pageEl = <AnalyticsPage isLive={isLiveMode}/>;
  }

  return (
    <div className="app-shell">
      <aside className="sidebar">
        <div className="sidebar-brand">
          <div className="brand-mark">IV</div>
          <div><div className="brand-word">IVORA</div><div className="brand-sub">Smart IV Monitoring</div></div>
        </div>
        <div className="nav-group-label">Navigation</div>
        {NAV_ITEMS.map(n => (
          <button key={n.id} className={"nav-item" + (page === n.id && !selectedBed ? ' active' : '')} onClick={() => { setPage(n.id); setSelectedBed(null); }}>
            <span className="nav-icon"><Ic name={n.icon} size={16}/></span>{n.label}
            {n.badge && openAlertsCount > 0 && <span className="nav-badge">{openAlertsCount}</span>}
          </button>
        ))}
        <div className="sidebar-foot">
          <div className="disclaimer-mini">
            Research prototype only. Non-invasive monitoring; not a clinical diagnostic system.
          </div>
        </div>
      </aside>

      <div className="main">
        <div className="topbar">
          <div className="search-box">
            <Ic name="search" size={15}/> Search beds, devices...
            <kbd>⌘K</kbd>
          </div>
          
          <div className="topbar-right">
            {/* Mode Switcher: Mock vs Live API */}
            <div className="mode-toggle-pill">
              <button className={"mode-toggle-btn" + (!isLiveMode ? ' active' : '')} onClick={() => toggleMode(false)}>
                Mock Mode
              </button>
              <button className={"mode-toggle-btn" + (isLiveMode ? ' active' : '')} onClick={() => toggleMode(true)}>
                Live API (8080)
              </button>
            </div>

            <div className="live-pill">
              <span className="live-dot" style={{background: isLiveMode && !apiConnected ? 'var(--high-fg)' : 'var(--normal-fg)'}}></span>
              {isLiveMode ? (apiConnected ? 'Connected to Spring Boot' : 'Connecting to API...') : 'Simulated Data'}
            </div>

            <div className="role-switch">
              <div className="avatar">RA</div>
              <span style={{fontSize: 12.5, fontWeight: 600}}>R. Anand (Nurse)</span>
            </div>
          </div>
        </div>

        <div className="content">{pageEl}</div>
      </div>

      {selectedAlert && <AlertDrawer alert={selectedAlert} onClose={() => setSelectedAlert(null)} onAcknowledge={handleAcknowledge} onResolve={handleResolve}/>}
      <Toasts toasts={toasts}/>
    </div>
  );
}

                `Weight remained nearly unchanged while infusion was expected. Observed mass flow dropped to ${bed.smoothedFlowRate.toFixed(2)} g/min, crossing the zero-flow threshold for over 120 seconds.` :
                `Bag weight is decreasing steadily at ${bed.smoothedFlowRate.toFixed(2)} g/min. Signal variance is within nominal research tolerance. No anomalies detected.`}
            </p>
          </div>

          {/* AI & Sensor Health Panel */}
          <div className="card card-pad">
            <div className="section-label" style={{marginBottom: 12}}>AI Sensor Health Layer (Python FastAPI Microservice)</div>
            <div style={{display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap: 12}}>
              <div className="metric-box">
                <div className="metric-box-title">Learned Baseline</div>
                <div className="metric-box-val">{bed.baseline.toFixed(1)} <span style={{fontSize:11,fontWeight:400}}>g</span></div>
              </div>
              <div className="metric-box">
                <div className="metric-box-title">Drift Score</div>
                <div className="metric-box-val">{bed.driftScore.toFixed(2)}</div>
              </div>
              <div className="metric-box">
                <div className="metric-box-title">Anomaly Index</div>
                <div className="metric-box-val">{bed.anomalyScore.toFixed(2)}</div>
              </div>
              <div className="metric-box">
                <div className="metric-box-title">Sensor Status</div>
                <div className="metric-box-val" style={{fontSize: 13, color: bed.sensorStatus==='NORMAL'?'var(--normal-fg)':'var(--review-fg)'}}>
                  {bed.sensorStatus}
                </div>
              </div>
            </div>
            <div className="disclaimer" style={{marginTop: 12}}>
              Algorithm: Isolation Forest & Sigmoidal Scaling. Evaluates sensor mechanical creep & electrical noise only; does not diagnose clinical conditions.
            </div>
          </div>
        </div>

        <div>
          {/* Explainable Evidence Scoring */}
          <div className="card card-pad" style={{marginBottom: 16}}>
            <div className="section-label" style={{marginBottom: 10}}>Explainable Evidence Score</div>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
              <span style={{fontSize: 28, fontFamily: 'var(--font-display)', fontWeight: 600, color: 'var(--primary)'}}>
                {bed.evidenceScore || 90}%
              </span>
              <span className="chip" style={{fontSize:11}}>High Confidence</span>
            </div>
            <div className="evidence-item"><Ic name="check" size={13}/> Flow rate derivative verified (g/min)</div>
            <div className="evidence-item"><Ic name="check" size={13}/> Sustained persistence threshold met</div>
            <div className="evidence-item"><Ic name="check" size={13}/> Signal stability confirmed via rolling variance</div>
          </div>

          {/* Channel Info */}
          <div className="card card-pad">
            <div className="section-label" style={{marginBottom: 10}}>Hardware Telemetry</div>
            <div style={{display:'flex',justifyContent:'space-between',fontSize:12.5,marginBottom:6}}>
              <span style={{color:'var(--text-faint)'}}>Microcontroller</span>
              <span className="mono">ESP32 (Dual HX711)</span>
            </div>
            <div style={{display:'flex',justifyContent:'space-between',fontSize:12.5,marginBottom:6}}>
              <span style={{color:'var(--text-faint)'}}>ADC Converter</span>
              <span className="mono">24-Bit HX711</span>
            </div>
            <div style={{display:'flex',justifyContent:'space-between',fontSize:12.5}}>
              <span style={{color:'var(--text-faint)'}}>Raw ADC Reading</span>
              <span className="mono">843,921 counts</span>
            </div>
          </div>
        </div>
      </div>
    </>
  );
}

/* ============================= ALERTS PAGE ============================= */
function AlertsPage({alerts, setSelectedAlert, onAcknowledge, onResolve}){
  return (
    <>
      <div className="page-title">Alert Queue</div>
      <div className="page-sub">Centralized alert management with explainable evidence scoring</div>

      <div className="card" style={{overflow:'hidden', marginTop: 18}}>
        {alerts.length === 0 ? (
          <div className="card-pad"><EmptyState title="No active alerts" sub="System operating nominally."/></div>
        ) : (
          alerts.map((a, i) => (
            <div key={a.id || i} style={{display:'flex',alignItems:'center',gap:16,padding:'16px 20px',borderBottom: i<alerts.length-1?'1px solid var(--border-soft)':'none'}}>
              <span className="badge high"><span className="badge-dot high"></span>{a.severity || 'HIGH'}</span>
              <div style={{flex: 1}}>
                <div style={{fontWeight:600, fontSize:13.5}}>{a.alertType || a.message} <span style={{color:'var(--text-faint)', fontWeight:400}}>· {a.bedCode}</span></div>
                <div style={{fontSize:12,color:'var(--text-soft)',marginTop:2}}>Evidence: {a.evidenceScore}% · Status: {a.status}</div>
              </div>
              <div style={{display:'flex', gap: 8}}>
                {a.status === 'OPEN' && (
                  <button className="btn btn-subtle btn-sm" onClick={() => onAcknowledge(a.id)}>Acknowledge</button>
                )}
                {a.status !== 'RESOLVED' && (
                  <button className="btn btn-primary btn-sm" onClick={() => onResolve(a.id)}>Resolve</button>
                )}
              </div>
            </div>
          ))
        )}
      </div>
    </>
  );
}

/* ============================= ALERT DRAWER ============================= */
function AlertDrawer({alert, onClose, onAcknowledge, onResolve}){
  return (
    <div className="overlay" onClick={onClose}>
      <div className="drawer" onClick={e=>e.stopPropagation()}>
        <div className="drawer-head">
          <div>
            <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:6}}>
              <span className="badge high"><span className="badge-dot high"></span>{alert.severity || 'HIGH'}</span>
              <span className="mono" style={{fontSize:11,color:'var(--text-faint)'}}>AL-{alert.id}</span>
            </div>
            <h3 style={{fontSize:17}}>{alert.alertType || 'Infusion Event'}</h3>
            <div className="page-sub" style={{marginTop:2}}>{alert.bedCode} · Evidence: {alert.evidenceScore}%</div>
          </div>
          <button className="icon-btn" onClick={onClose}><Ic name="x" size={15}/></button>
        </div>

        <div className="drawer-body">
          <p style={{fontSize:13.5,lineHeight:1.6,color:'var(--text)'}}>
            {alert.message || 'A deterministic rule conditions threshold was sustained over the configured duration window.'}
          </p>

          <div className="section-label" style={{margin:'18px 0 8px'}}>Rule Evidence Factors</div>
          <div className="evidence-item"><Ic name="check" size={13}/> Flow rate near zero</div>
          <div className="evidence-item"><Ic name="check" size={13}/> Sustained duration condition met</div>

          <div style={{display:'flex',gap:8,marginTop:24}}>
            {alert.status === 'OPEN' && (
              <button className="btn btn-subtle btn-sm" onClick={() => { onAcknowledge(alert.id); onClose(); }}>Acknowledge</button>
            )}
            {alert.status !== 'RESOLVED' && (
              <button className="btn btn-primary btn-sm" onClick={() => { onResolve(alert.id); onClose(); }}>Resolve</button>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

  return (
    <>
      <div className="page-title">Research Analytics</div>
      <div className="page-sub">Experimental Validation Metrics for IEEE Conference Prototype</div>

      <div className="summary-row" style={{marginTop: 18}}>
        <div className="summary-card"><div className="summary-num">{metrics ? (metrics.eventAccuracy * 100).toFixed(1) : '96.2'}%</div><div className="summary-lbl">Event Accuracy</div></div>
        <div className="summary-card"><div className="summary-num">{metrics ? (metrics.eventPrecision * 100).toFixed(1) : '94.1'}%</div><div className="summary-lbl">Precision</div></div>
        <div className="summary-card"><div className="summary-num">{metrics ? (metrics.eventRecall * 100).toFixed(1) : '95.0'}%</div><div className="summary-lbl">Recall / Sensitivity</div></div>

        <div className="summary-card"><div className="summary-num">{metrics ? metrics.averageDetectionLatencyMs.toFixed(0) : '3200'} ms</div><div className="summary-lbl">Avg Detection Latency</div></div>
      </div>

      <div className="card card-pad">
        <div className="section-label" style={{marginBottom: 8}}>Comparative Evaluation (Rule-Only vs. Proposed Rule + AI)</div>
        <table className="data-table" style={{marginTop: 12}}>
          <thead>
            <tr><th>Evaluation Configuration</th><th>Accuracy</th><th>False Positives</th><th>False Negatives</th><th>Drift Detection Rate</th></tr>
          </thead>

            <tr>
              <td>Baseline: Rule Engine Without AI</td>
              <td>94.12%</td>
              <td>18</td>
              <td>32</td>
              <td>N/A (Threshold only)</td>

            <tr style={{fontWeight:600}}>
              <td>Proposed: Rule Engine + Lightweight Isolation Forest</td>
              <td style={{color:'var(--normal-fg)'}}>98.35%</td>
              <td style={{color:'var(--normal-fg)'}}>8</td>
              <td style={{color:'var(--normal-fg)'}}>6</td>
              <td style={{color:'var(--normal-fg)'}}>91.5%</td>

        </table>
        <div className="disclaimer" style={{marginTop: 14}}>
          Designated as SYNTHETIC DATASET RESULT. Final IEEE publication values will reflect controlled benchtop hardware validation.
        </div>

    </>
  );
}
